<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dissertation Defense Slides | Dig Vijay Kumar Yarlagadda</title>
<meta name="description" content="Representation Learning for Modeling the Spatial Architecture of Cancer. PhD thesis defense slides with embedded videos.">
<style>
  :root { --bg: #111; --fg: #eee; --muted: #9a9a9a; --bar: #1c1c1c; --accent: #7fb3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #viewport { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; }
  #stage { position: relative; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 64px) * 16 / 9));
    background: #000; box-shadow: 0 2px 20px rgba(0,0,0,.6); user-select: none; -webkit-user-select: none; }
  #stage img.slide { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vwrap { position: absolute; overflow: hidden; display: none; }
  .vwrap.on { display: block; }
  .vwrap video { position: absolute; left: 0; width: 100%; object-fit: fill; background: transparent; }
  #bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--bar); border-top: 1px solid #2a2a2a; }
  #bar button { background: #2b2b2b; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #363636; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #count { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  #vstat { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #vstat:empty { display: none; }
  #bar a { color: var(--accent); text-decoration: none; }
  #bar a:hover { text-decoration: underline; }
  .sep { color: #444; }
  :fullscreen #bar { display: none; }
  :fullscreen #stage { width: min(100vw, calc(100vh * 16 / 9)); box-shadow: none; }
  :fullscreen #viewport { padding: 0; }
  @media (max-width: 600px) { #bar { gap: 6px; padding: 8px 12px; } #bar .wide { display: none; } }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" aria-live="polite">
    <img class="slide" id="slideimg" alt="Slide 1" decoding="async">
  </div>
</div>
<div id="bar">
  <button id="prev" aria-label="Previous slide">&#8592;</button>
  <span id="count">1 / 44</span>
  <button id="next" aria-label="Next slide">&#8594;</button>
  <button id="fs" class="wide" aria-label="Full screen">Full screen</button>
  <span id="vstat"></span>
  <span class="sep">|</span>
  <a href="../../">Home</a>
</div>
<noscript><p style="text-align:center">This slide viewer needs JavaScript.</p></noscript>
<script>
(function () {
  var N = 44;
  // Slide images: lossless renders of the PowerPoint PDF export at each width. The viewer loads the
  // smallest width that covers the stage in device pixels and upgrades (never downgrades) on resize or full screen.
  var TIERS = [1920, 2560, 3840, 5120];
  // Video placement copied from the PPTX (EMU / slide size, srcRect crop in fractions).
  // hd: 1920 px encode that starts at once. orig: the original video from the deck, byte for byte, split into
  // parts under GitHub's file size limit; once all parts arrive it replaces the hd copy in place.
  var VIDEOS = [
    { slide: 7,  hd: "video/slide07.mp4", orig: "video/slide07_original.mp4.part", parts: 4, bytes: 190257630,
      left: 6285844 / 12192000, top: 797800 / 6858000, width: 5906155 / 12192000, height: 3278846 / 6858000,
      cropT: 0.06013, cropB: 0.08105, controls: false },
    { slide: 19, hd: "video/slide19.mp4", orig: "video/slide19_original.mp4.part", parts: 3, bytes: 125621028,
      left: 739775 / 12192000, top: 768747 / 6858000, width: 10712450 / 12192000, height: 6025753 / 6858000,
      cropT: 0, cropB: 0, controls: true }
  ];
  var stage = document.getElementById("stage"), img = document.getElementById("slideimg");
  var countEl = document.getElementById("count"), prevB = document.getElementById("prev"), nextB = document.getElementById("next");
  var vstat = document.getElementById("vstat");
  var cur = 1, cache = {}, tier = 0, token = 0;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function stagePx() { return stage.getBoundingClientRect().width * (window.devicePixelRatio || 1); }
  function pickTier() {
    var px = stagePx();
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i] >= px * 0.98) return TIERS[i];
    return TIERS[TIERS.length - 1];
  }
  function srcFor(n) { return "img/" + tier + "/s-" + pad(n) + ".webp"; }
  // Original videos are 126 to 190 MB; skip them on phone-sized screens and when the browser asks to save data.
  function wantOriginal() {
    var c = navigator.connection;
    return !(c && c.saveData) && !!window.fetch && window.matchMedia("(min-width: 1000px)").matches;
  }

  function makeVideo(v) {
    var vid = document.createElement("video");
    var full = 1 - v.cropT - v.cropB;
    vid.style.height = (100 / full) + "%";
    vid.style.top = (-100 * v.cropT / full) + "%";
    vid.muted = true; vid.loop = true; vid.playsInline = true; vid.preload = "none";
    vid.setAttribute("muted", ""); vid.setAttribute("playsinline", "");
    if (v.controls) vid.controls = true;
    else vid.addEventListener("click", function (e) { e.stopPropagation(); vid.paused ? vid.play() : vid.pause(); });
    return vid;
  }
  function play(vid) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); }

  VIDEOS.forEach(function (v) {
    var w = document.createElement("div");
    w.className = "vwrap";
    w.style.left = (v.left * 100) + "%"; w.style.top = (v.top * 100) + "%";
    w.style.width = (v.width * 100) + "%"; w.style.height = (v.height * 100) + "%";
    v.video = makeVideo(v);
    w.appendChild(v.video); stage.appendChild(w);
    v.wrap = w; v.got = 0;
  });

  function showStat() {
    var v = VIDEOS.filter(function (x) { return x.slide === cur; })[0];
    vstat.textContent = v && v.loading && !v.origUrl ? "Loading original video " + Math.floor(100 * v.got / v.bytes) + "%" : "";
  }

  function fetchPart(v, url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(url + " " + r.status);
      if (!r.body || !r.body.getReader) return r.blob().then(function (b) { v.got += b.size; showStat(); return b; });
      var reader = r.body.getReader(), chunks = [];
      return (function pump() {
        return reader.read().then(function (x) {
          if (x.done) return new Blob(chunks);
          chunks.push(x.value); v.got += x.value.length; showStat();
          return pump();
        });
      })();
    });
  }

  // Swap in a second <video> once it has the frame at the current time, so the upgrade has no black flash.
  function upgrade(v, url) {
    var old = v.video, nv = makeVideo(v);
    nv.preload = "auto"; nv.src = url;
    nv.addEventListener("loadeddata", function () {
      var t = old.currentTime || 0, live = v.wrap.classList.contains("on") && !old.paused;
      var done = false, fin = function () {
        if (done) return; done = true;
        v.wrap.replaceChild(nv, old); v.video = nv;
        old.pause(); old.removeAttribute("src"); old.load();
        if (live && v.slide === cur) play(nv);
      };
      nv.addEventListener("seeked", fin, { once: true });
      setTimeout(fin, 1500);
      try { nv.currentTime = Math.min(t + (live ? 0.1 : 0), (nv.duration || t + 1) - 0.05); } catch (e) { fin(); }
    }, { once: true });
  }

  function loadOriginal(v) {
    if (v.loading || !wantOriginal()) return;
    v.loading = true; showStat();
    var urls = [];
    for (var i = 0; i < v.parts; i++) urls.push(v.orig + i);
    Promise.all(urls.map(function (u) { return fetchPart(v, u); })).then(function (blobs) {
      v.origUrl = URL.createObjectURL(new Blob(blobs, { type: "video/mp4" }));
      showStat();
      upgrade(v, v.origUrl);
    }).catch(function () { v.loading = false; v.got = 0; showStat(); });
  }

  // Toggle videos once the new slide image is on screen, so a video never sits on the wrong slide.
  function syncVideos(n) {
    VIDEOS.forEach(function (v) {
      if (v.slide === n) {
        if (!v.video.getAttribute("src")) v.video.src = v.origUrl || v.hd;
        v.wrap.classList.add("on");
        play(v.video);
        if (!v.origUrl) loadOriginal(v);
      } else {
        v.wrap.classList.remove("on");
        if (!v.video.paused) v.video.pause();
        if (v.slide === n + 1) {
          if (!v.video.getAttribute("src")) { v.video.preload = "auto"; v.video.src = v.origUrl || v.hd; }
          if (!v.origUrl) loadOriginal(v);
        }
      }
    });
    showStat();
  }

  function preload(n) {
    if (n < 1 || n > N) return;
    var s = srcFor(n);
    if (cache[s]) return;
    var im = new Image(); im.src = s; cache[s] = im;
  }

  function show(n) {
    n = Math.max(1, Math.min(N, n));
    cur = n;
    var my = ++token, applied = false;
    var apply = function () { if (my === token && !applied) { applied = true; syncVideos(n); } };
    img.onload = img.onerror = apply;
    setTimeout(apply, 2000);
    img.src = srcFor(n); img.alt = "Slide " + n;
    countEl.textContent = n + " / " + N;
    prevB.disabled = n === 1; nextB.disabled = n === N;
    showStat();
    if (location.hash !== "#" + n) history.replaceState(null, "", "#" + n);
    preload(n + 1); preload(n + 2); preload(n - 1);
  }

  function retier() {
    var t = pickTier();
    if (t <= tier) return;
    tier = t; show(cur);
  }
  var rt = null;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(retier, 200); });
  document.addEventListener("fullscreenchange", function () { setTimeout(retier, 100); });
  tier = pickTier();

  function fromHash() { var h = parseInt(location.hash.slice(1), 10); return isNaN(h) ? 1 : h; }

  prevB.addEventListener("click", function () { show(cur - 1); });
  nextB.addEventListener("click", function () { show(cur + 1); });
  document.getElementById("fs").addEventListener("click", toggleFs);
  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  stage.addEventListener("click", function (e) {
    if (e.target.tagName === "VIDEO") return;
    var r = stage.getBoundingClientRect();
    show(e.clientX - r.left < r.width * 0.3 ? cur - 1 : cur + 1);
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") { e.preventDefault(); show(cur + 1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); show(cur - 1); }
    else if (k === "Home") show(1);
    else if (k === "End") show(N);
    else if (k === "f" || k === "F") toggleFs();
  });

  var tx = null, ty = null;
  stage.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(dx < 0 ? cur + 1 : cur - 1);
    tx = ty = null;
  });

  window.addEventListener("hashchange", function () { var h = fromHash(); if (h !== cur) show(h); });
  show(fromHash());
})();
</script>
</body>
</html>
